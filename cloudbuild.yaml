# Build configuration
substitutions:
  _REGION: us-central1
  _REPOSITORY: microservices
  _BUILD_SERVICE_ACCOUNT: cloud-build-sa

# Cloud Build service account
serviceAccount: projects/$PROJECT_ID/serviceAccounts/${_BUILD_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com

options:
  # Send logs to Cloud Logging
  logging: CLOUD_LOGGING_ONLY
  # Expose substitutions as environment variables
  automapSubstitutions: true

steps:
  # Build images
  - id: build-images
    name: gcr.io/cloud-builders/docker
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Validate commit SHA
      [[ "${COMMIT_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || {
        echo 'COMMIT_SHA must be a full 40-character Git commit SHA.' >&2
        exit 1
      }
      for service in service-a service-b; do
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${service}"
        docker build --tag "${image}:${COMMIT_SHA}" "services/${service}"
      done

  # Push images to Artifact Registry
  - id: push-images
    name: gcr.io/cloud-builders/docker
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      for service in service-a service-b; do
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${service}"
        docker push "${image}:${COMMIT_SHA}"
      done

  # Resolve image digests
  - id: resolve-image-digests
    name: gcr.io/cloud-builders/docker
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      for service in service-a service-b; do
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${service}"
        reference="$(docker image inspect "${image}:${COMMIT_SHA}" \
          --format '{{index .RepoDigests 0}}')"
        digest="${reference#"${image}@"}"
        [[ "${reference}" == "${image}@"* && "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo "Invalid pushed image digest for ${service}: ${reference}" >&2
          exit 1
        }
        printf '%s\n' "${reference}" > "/workspace/${service}-image.txt"
      done

  # Deploy images to Cloud Run
  - id: deploy-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      for service in service-a service-b; do
        image="$(cat "/workspace/${service}-image.txt")"
        gcloud run services update "${service}" \
          --image="${image}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --quiet
      done
